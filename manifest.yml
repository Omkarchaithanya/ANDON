app:
  id: ari:cloud:ecosystem::app/andon-shadow-radar
  runtime:
    name: nodejs22.x
  description: >
    Shadow-change radar for robotized workplaces.
    Discovers when facilities maintenance requests might affect robot deployments
    whose commissioning assumed different environmental conditions.

modules:
  jira:issuePanel:
    - key: andon-panel
      title: ANDON Shadow Radar
      resource: frontend
      resolver:
        function: resolver
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  sql:
    - key: main

  llm:
    - key: andon-extractor
      model:
        - claude-3-5-sonnet

  function:
    - key: resolver
      handler: index.handler
    - key: consumer-handler
      handler: index.processQueueEvent
    - key: install-handler
      handler: index.onInstallOrUpgrade
    - key: jira-event-handler
      handler: index.onJiraEvent
    - key: confluence-event-handler
      handler: index.onConfluenceEvent

  trigger:
    - key: app-installed-trigger
      function: install-handler
      events:
        - avi:forge:installed:app
    - key: app-upgraded-trigger
      function: install-handler
      events:
        - avi:forge:upgraded:app
    - key: jira-issue-created
      function: jira-event-handler
      events:
        - avi:jira:created:issue
    - key: jira-issue-updated
      function: jira-event-handler
      events:
        - avi:jira:updated:issue
    - key: confluence-page-updated
      function: confluence-event-handler
      events:
        - avi:confluence:updated:page

  consumer:
    - key: andon-event-consumer
      queue: andon-events
      function: consumer-handler

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.all
    - read:confluence-space.summary
    - read:confluence-user
    - read:graph:page:confluence
    - read:graph:user:atlassian

resources:
  - key: frontend
    path: static/frontend/build
